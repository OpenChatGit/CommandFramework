name: Package and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify and Package Release ZIP
      shell: pwsh
      run: |
        $distDir = "dist"
        $staging = "dist/package"
        if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
        New-Item -ItemType Directory -Path $staging -Force | Out-Null

        # Ensure required release files exist
        $requiredFiles = @(
            "CommandFramework.dll",
            "manifest.json",
            "meta.json",
            "icon.png",
            "README.md",
            "CHANGELOG.md",
            "API_GUIDE.md"
        )

        foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
                throw "Missing required release file: $file"
            }
            Copy-Item "$file" "$staging/$file" -Force
            Write-Output "Included: $file"
        }

        # Verify SHA-256 hash against meta.json
        $dllHash = (Get-FileHash -Path "CommandFramework.dll" -Algorithm SHA256).Hash.ToLower()
        Write-Output "Verified DLL SHA-256: sha256:$dllHash"

        $zipPath = "dist/CommandFramework-release.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $zipPath)
        Remove-Item $staging -Recurse -Force

        Write-Output "Successfully generated release ZIP: $zipPath"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CommandFramework-Release
        path: dist/CommandFramework-release.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/CommandFramework-release.zip
        body_path: CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
