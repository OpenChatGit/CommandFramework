name: Package and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify and Package Release ZIP
      id: package_step
      shell: pwsh
      run: |
        $manifest = Get-Content "manifest.json" | ConvertFrom-Json
        $version = $manifest.version_number
        $tag = "v$version"
        Write-Output "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Output "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

        $distDir = "dist"
        $staging = "dist/package"
        if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
        New-Item -ItemType Directory -Path $staging -Force | Out-Null

        $requiredFiles = @(
            "CommandFramework.dll",
            "manifest.json",
            "meta.json",
            "icon.png",
            "README.md",
            "CHANGELOG.md",
            "API_GUIDE.md"
        )

        foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
                throw "Missing required release file: $file"
            }
            Copy-Item "$file" "$staging/$file" -Force
            Write-Output "Included: $file"
        }

        # Verify SHA-256 hash
        $dllHash = (Get-FileHash -Path "CommandFramework.dll" -Algorithm SHA256).Hash.ToLower()
        Write-Output "Verified DLL SHA-256: sha256:$dllHash"

        $zipPath = "dist/CommandFramework-$version.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $zipPath)
        Remove-Item $staging -Recurse -Force

        Write-Output "Successfully generated release ZIP: $zipPath"
        Write-Output "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CommandFramework-Release
        path: ${{ env.ZIP_PATH }}

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "Command Framework ${{ env.RELEASE_TAG }}"
        files: ${{ env.ZIP_PATH }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
