name: Build & Release Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(jq -r '.version_number // .version' manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION=$(jq -r '.artifact.version' meta.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted Version: $VERSION"

      - name: Update SHA-256 in meta.json
        run: |
          SHA256=$(sha256sum CommandFramework.dll | awk '{print $1}')
          jq --arg hash "sha256:$SHA256" '.artifact.hash = $hash' meta.json > meta.json.tmp && mv meta.json.tmp meta.json
          cat meta.json

      - name: Assemble Release Package
        run: |
          mkdir -p staging
          cp CommandFramework.dll staging/
          cp manifest.json staging/
          cp README.md staging/
          cp icon.png staging/
          cp meta.json staging/
          cp CHANGELOG.md staging/
          
          cd staging
          zip -r "../CommandFramework-${{ env.VERSION }}.zip" ./*
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommandFramework-${{ env.VERSION }}
          path: CommandFramework-${{ env.VERSION }}.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            CommandFramework-${{ env.VERSION }}.zip
            CommandFramework.dll
            meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
